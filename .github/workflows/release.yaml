name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: windows_amd64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, asset: windows_arm64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: linux_arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: darwin_amd64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: darwin_arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($metadata.packages[0].version)") { throw "Tag must match Cargo.toml version" }
      - run: cargo test --locked --target ${{ matrix.target }} --all-targets
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist, package | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ippin.exe, README.md -Destination package
          Copy-Item docs -Destination package -Recurse
          Compress-Archive -Path package/* -DestinationPath dist/ippin_${{ matrix.asset }}.zip
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist package
          cp target/${{ matrix.target }}/release/ippin README.md package/
          cp -R docs package/
          tar -czf dist/ippin_${{ matrix.asset }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ippin_${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums and release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum ippin_* > checksums.txt
          notes_file="../docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes_file" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "IPPin $RELEASE_TAG" --notes-file "$notes_file" ./*
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes ./*
          fi
